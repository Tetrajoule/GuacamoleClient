name: PublishRelease - WinForms MSIX

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  PAGES_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

jobs:
  winforms-msix:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Resolve release metadata
        shell: pwsh
        env:
          RAW_TAG: ${{ github.event.release.tag_name }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          $version = if ($env:RAW_TAG) { $env:RAW_TAG -replace '^v', '' } else { "0.0.0.$env:GITHUB_RUN_NUMBER" }
          if ($version -notmatch '^\d+\.\d+\.\d+\.\d+$') { throw 'The MSIX release requires a four-part numeric version.' }
          $channel = if (-not $env:RAW_TAG) { 'test' } elseif ($env:IS_PRERELEASE -eq 'true') { 'dev' } else { 'stable' }
          $tag = if ($env:RAW_TAG) { $env:RAW_TAG } else { "preview-$($env:GITHUB_REF_NAME -replace '[^A-Za-z0-9-]', '-')-$env:GITHUB_RUN_NUMBER" }
          "VERSION=$version" >> $env:GITHUB_ENV
          "CHANNEL=$channel" >> $env:GITHUB_ENV
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV

      - name: Publish self-contained application payload
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'msix-publish'
          dotnet publish GuacamoleClient-WinForms/GuacamoleClient-WinForms.csproj `
            --configuration Release --runtime win-x64 --self-contained true --output $out `
            -p:Version=$env:VERSION -p:FileVersion=$env:VERSION -p:AssemblyVersion=$env:VERSION `
            -p:InformationalVersion=$env:VERSION -p:GuacamoleAppChannel=$env:CHANNEL
          if ($LASTEXITCODE -ne 0) { throw 'WinForms publish failed.' }
          @{
            schemaVersion = 1
            appId = 'winforms'
            deploymentType = 'msix'
            channel = $env:CHANNEL
            version = $env:VERSION
            updatesUrl = "${{ env.PAGES_BASE_URL }}/app-updates.json"
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $out 'app-info.json') -Encoding utf8

      - name: Package and verify MSIX
        shell: pwsh
        run: |
          $file = "GuacamoleClient-WinForms-msix-$env:VERSION.msix"
          $package = Join-Path $env:GITHUB_WORKSPACE $file
          $options = @{}
          if ($env:GITHUB_REPOSITORY -ne 'jochenwezel/GuacamoleClient') {
            $options.PackageName = "${{ github.repository_owner }}.GuacamoleClient"
            $options.Publisher = "CN=${{ github.repository_owner }} GuacamoleClient"
            $options.PublisherDisplayName = '${{ github.repository_owner }}'
          }
          ./tools/New-WinFormsMsix.ps1 -PublishDirectory (Join-Path $env:RUNNER_TEMP 'msix-publish') `
            -OutputPath $package -Version $env:VERSION @options
          ./tests/packaging/Test-WinFormsMsix.ps1 -PackagePath $package -Version $env:VERSION `
            -UpdatesUrl "${{ env.PAGES_BASE_URL }}/app-updates.json"
          "MSIX_FILE=$file" >> $env:GITHUB_ENV

      - name: Publish MSIX to the release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.MSIX_FILE }}
          tag_name: ${{ env.RELEASE_TAG }}
          prerelease: ${{ github.event_name != 'release' || github.event.release.prerelease }}
          make_latest: ${{ github.event_name == 'release' && !github.event.release.prerelease }}
